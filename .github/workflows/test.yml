name: Test the Homebrew install
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install --formula rahulchaube1/blyx/blyx
      - run: brew test rahulchaube1/blyx/blyx
      - run: brew install --formula rahulchaube1/blyx/modelgate
      - run: brew test rahulchaube1/blyx/modelgate
      - run: brew install --formula rahulchaube1/blyx/linearfit
      - run: brew test rahulchaube1/blyx/linearfit
      - run: brew install --formula rahulchaube1/blyx/residualwatch
      - run: brew test rahulchaube1/blyx/residualwatch
      - run: brew install --formula rahulchaube1/blyx/blyxtorch
      - run: brew test rahulchaube1/blyx/blyxtorch
      - name: Install and run the Blyx source collection
        run: |
          brew install --formula rahulchaube1/blyx/blyx-packages
          brew test rahulchaube1/blyx/blyx-packages
          project="$(brew --prefix rahulchaube1/blyx/blyx-packages)/share/blyx/moments"
          blyxc native-run "$project/main.blyx" > "$RUNNER_TEMP/blyx-moments.txt"
          diff -u "$project/expected.txt" "$RUNNER_TEMP/blyx-moments.txt"
